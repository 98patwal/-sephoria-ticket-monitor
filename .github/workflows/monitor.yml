name: SEPHORiA Ticket Monitor

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check resale inventory
        run: |
          RESPONSE=$(curl -s \
            -H "User-Agent: Mozilla/5.0" \
            -H "Accept: application/json" \
            "https://api.weezevent.com/ticket/widgets/resale-sephoria-london-2026?locale=en-gb")

          ON_RESALE=$(echo "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['first_step']['data']['ticket-market-rates']['on_resale'])")

          echo "ON_RESALE=$ON_RESALE"

          if [ "$ON_RESALE" = "True" ]; then
            echo "🚨 TICKET AVAILABLE — sending notification"

            curl -s \
              -H "Title: SEPHORiA London ticket available!" \
              -H "Priority: max" \
              -H "Tags: ticket" \
              -d "A SEPHORiA London resale ticket is available. Tap to view: https://widget.weezevent.com/ticket/resale-sephoria-london-2026?locale=en-gb" \
              "https://ntfy.sh/PA1998-SepLDN"
          else
            echo "No resale ticket available."
          fi
