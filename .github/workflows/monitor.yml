name: SEPHORiA Ticket Monitor

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check resale inventory
        run: |
          python - <<'PY'
          import requests
          import json

          url = "https://api.weezevent.com/ticket/widgets/resale-sephoria-london-2026?locale=en-gb"

          r = requests.get(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              },
              timeout=30
          )

          print("STATUS:", r.status_code)
          print("CONTENT TYPE:", r.headers.get("content-type"))
          print("LENGTH:", len(r.text))
          print()
          print("----- INVENTORY RESPONSE -----")

          try:
              data = r.json()
              print(json.dumps(data, indent=2))
          except Exception:
              print(r.text)



          print("----- END RESPONSE -----")
          PY
