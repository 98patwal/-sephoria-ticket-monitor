name: SEPHORiA Ticket Monitor

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Set up browser
        run: |
          python -m pip install playwright
          playwright install chromium

      - name: Inspect Weezevent network
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://widget.weezevent.com/ticket/resale-sephoria-london-2026?locale=en-gb"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              def request_handler(request):
                  u = request.url
                  if any(x in u.lower() for x in ["api", "ticket", "resale", "event"]):
                      print("REQUEST:", request.method, u)

              page.on("request", request_handler)

              print("Loading Weezevent...")
              page.goto(url, wait_until="networkidle", timeout=60000)

              print("Page loaded.")
              print("TITLE:", page.title())

              browser.close()
          PY
