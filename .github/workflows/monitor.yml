name: SEPHORiA Ticket Monitor

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check resale inventory
        run: |
          RESPONSE=$(curl -s \
            -H "User-Agent: Mozilla/5.0" \
            -H "Accept: application/json" \
            "https://api.weezevent.com/ticket/widgets/resale-sephoria-london-2026?locale=en-gb")

          echo "$RESPONSE" > response.json

          python - <<'PY'
          import json

          with open("response.json") as f:
              data = json.load(f)

          def find_on_resale(obj):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key == "on_resale":
                          return value
                      result = find_on_resale(value)
                      if result is not None:
                          return result
              elif isinstance(obj, list):
                  for item in obj:
                      result = find_on_resale(item)
                      if result is not None:
                          return result
              return None

          on_resale = find_on_resale(data)

          print("ON_RESALE:", on_resale)

          if on_resale is True:
              print("TICKET AVAILABLE")
              with open("ticket_available.txt", "w") as f:
                  f.write("YES")
          else:
              print("NO TICKET AVAILABLE")
              with open("ticket_available.txt", "w") as f:
                  f.write("NO")
          PY

          if [ "$(cat ticket_available.txt)" = "YES" ]; then
            curl -s \
              -H "Title: SEPHORiA London ticket available!" \
              -H "Priority: max" \
              -H "Tags: ticket" \
              -d "A SEPHORiA London resale ticket is available. Tap here: https://widget.weezevent.com/ticket/resale-sephoria-london-2026?locale=en-gb" \
              "https://ntfy.sh/PA1998-SepLDN"

            echo "NTFY NOTIFICATION SENT"
          else
            echo "No notification needed."
          fi
