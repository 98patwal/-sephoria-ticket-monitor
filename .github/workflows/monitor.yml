name: SEPHORiA Ticket Monitor

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Find Weezevent API calls
        run: |
          python - <<'PY'
          import requests
          import re

          js_url = "https://widget.weezevent.com/ticket/static/js/index-D9eAwfqC.js"

          r = requests.get(
              js_url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=30
          )

          print("STATUS:", r.status_code)
          print("LENGTH:", len(r.text))
          print("----- POSSIBLE API URLS -----")

          urls = sorted(set(re.findall(r'https?[^"\'\\ ]+', r.text)))

          for url in urls:
              if "weezevent" in url.lower() or "api" in url.lower():
                  print(url[:500])

          print("----- SEARCH TERMS -----")

          for term in ["resale", "ticket", "availability", "api.weezevent"]:
              print()
              print("###", term)

              for match in re.finditer(term, r.text, re.IGNORECASE):
                  start = max(0, match.start() - 250)
                  end = min(len(r.text), match.end() + 500)
                  print(r.text[start:end])
                  print("---")
          PY
