name: SEPHORiA Ticket Monitor

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Find API calls
        run: |
          python - <<'PY'
          import requests
          import re

          url = "https://widget.weezevent.com/ticket/static/js/index-D9eAwfqC.js"

          r = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=30)

          print("STATUS:", r.status_code)
          print("LENGTH:", len(r.text))

          text = r.text

          # Look only around occurrences of api.weezevent
          matches = list(re.finditer("api.weezevent", text, re.I))

          print("API REFERENCES FOUND:", len(matches))

          for i, m in enumerate(matches[:5]):
              print("\n===== MATCH", i + 1, "=====")
              start = max(0, m.start() - 300)
              end = min(len(text), m.end() + 700)
              print(text[start:end])

          # Look for likely resale-related API paths
          print("\n===== RESALE API REFERENCES =====")

          for term in ["resale", "resale-sephoria", "ticket/resale"]:
              matches = list(re.finditer(term, text, re.I))
              print(term, ":", len(matches))

              for m in matches[:3]:
                  start = max(0, m.start() - 200)
                  end = min(len(text), m.end() + 500)
                  print(text[start:end])
                  print("---")
          PY
